name = "ai-cloud-platform-back"
main = "src/index.js"
compatibility_date = "2024-07-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PUBLIC_BASE_URL = "https://ai-cloud-platform.pages.dev"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "ai-cloud-uploads"

[[d1_databases]]
binding = "D1"
database_name = "ai-cloud-platform"
database_id = "REPLACE_WITH_D1_ID"

[observability]
enabled = true
